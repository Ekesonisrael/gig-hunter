name: Gig Hunter

on:
  schedule:
    # Every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in TEST mode (no Telegram send, seen.json not saved)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Prevent overlapping runs from clobbering seen.json
concurrency:
  group: gig-hunter
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit seen.json back to the repo

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run Gig Hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          FEED_TEST:          ${{ github.event.inputs.test_mode == 'true' && '1' || '0' }}
        run: python main.py

      - name: Persist seen.json
        if: always() && github.event.inputs.test_mode != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f seen.json ]; then
            git add seen.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update seen.json [skip ci]"
              git push || (git pull --rebase --autostash && git push)
            else
              echo "seen.json unchanged; nothing to commit."
            fi
          else
            echo "seen.json not created this run; nothing to commit."
          fi
