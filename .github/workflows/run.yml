name: gig-hunter
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: gig-hunter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests feedparser
      - run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEED_TEST: ${{ vars.FEED_TEST }}
      - name: Save seen list
        run: |
          git config user.name  "gig-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "update seen list"
          git push
